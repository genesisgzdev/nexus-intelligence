name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7.0.0
        with:
          version: "0.5.24"
      - name: Verify lockfile
        run: uv lock --check
      - name: Create clean environment and install project
        run: uv sync --frozen --extra dev
      - name: Compile Python sources
        run: uv run python -m compileall -q nexus_intelligence
      - name: Run tests
        run: uv run pytest -q
