name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          version: "0.5.24"
      - name: Verify lockfile
        run: uv lock --check
      - name: Create clean environment and install project
        run: uv sync --frozen --extra dev
      - name: Compile Python sources
        run: uv run python -m compileall -q nexus_intelligence
      - name: Run tests
        run: uv run pytest -q
