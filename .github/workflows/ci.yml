name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.24"
      - name: Verify lockfile
        run: uv lock --check
      - name: Create clean environment and install project
        run: uv sync --frozen --extra dev
      - name: Compile Python sources
        run: uv run python -m compileall -q nexus_intelligence
      - name: Run tests
        run: uv run pytest -q
