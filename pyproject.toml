[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-intelligence"
version = "3.3.2"
authors = [
  { name="Genesis", email="genzt.dev@pm.me" },
]
description = "Professional Zero-API OSINT Framework for security researchers"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "aiosqlite>=0.20.0",
    "beautifulsoup4>=4.12.3",
    "cryptography>=42.0.5",
    "curl_cffi>=0.7.0",
    "dnspython>=2.6.1",
    "jinja2>=3.1.3",
    "lxml>=5.1.0",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "rich>=13.7.1",
    "scikit-learn>=1.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
]

[project.urls]
"Homepage" = "https://github.com/genesisgzdev/nexus-intelligence"
"Bug Tracker" = "https://github.com/genesisgzdev/nexus-intelligence/issues"

[project.scripts]
nexus-intel = "nexus_intelligence.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_intelligence*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
